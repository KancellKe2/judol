name: Update Judol Blocklist

on:
  schedule:
    - cron: "0 */6 * * *"   # setiap 6 jam
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate keywords & collect
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_MODEL: ${{ secrets.OMNI_MODEL }}
        run: python scripts/collect.py

      - name: Verifikasi dengan AI
        env:
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          OMNI_MODEL: ${{ secrets.OMNI_MODEL }}
          MAX_VERIFY: "100"
        run: python scripts/verify_ai.py

      - name: Generate blocklist
        run: python scripts/generate_list.py

      - name: Commit hasil
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update blocklist $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
